<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hold &amp; Spin - Casino</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Hold & Spin Specific Styles ────────────────────────────────── */

        .hs-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* ── Left sidebar ─────────────────────────────────────────────── */
        .hs-sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .jackpot-strip {
            background: var(--bg-base);
            border: 1px solid var(--bg-hover);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .jackpot-strip-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }
        .jackpot-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .jackpot-row:last-child { margin-bottom: 0; }
        .jp-grand-row { background: linear-gradient(90deg, #7c1d1d, #dc2626); color: #fbbf24; }
        .jp-major-row { background: linear-gradient(90deg, #431407, #c2410c); color: #fed7aa; }
        .jp-minor-row { background: linear-gradient(90deg, #422006, #d97706); color: #fef3c7; }
        .jp-mini-row  { background: linear-gradient(90deg, #1c1917, #57534e); color: #fde68a; }

        .hs-controls {
            background: var(--bg-base);
            border: 1px solid var(--bg-hover);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hs-paytable {
            background: var(--bg-base);
            border: 1px solid var(--bg-hover);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .hs-paytable-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }
        .pay-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .pay-row:last-child { border-bottom: none; }
        .pay-sym     { font-size: 1rem; line-height: 1.4; }
        .pay-sym-bar { font-size: 0.82rem; font-weight: 900; color: #fbbf24; }
        .pay-vals    { color: var(--text-muted); font-size: 0.72rem; }

        /* ── Game area ────────────────────────────────────────────────── */
        .hs-game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            overflow: visible;
        }

        .hs-status {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 700;
            gap: 18px;
        }
        .hs-fire  { color: #f97316; }
        .hs-gold  { color: #fbbf24; }
        .hs-green { color: var(--success); }

        /* ── 3×3 Grid ─────────────────────────────────────────────────── */
        .hs-grid-wrapper {
            position: relative;
            overflow: visible;
        }

        .hs-grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows:    repeat(3, 100px);
            gap: 10px;
            background: #0c0e13;
            padding: 16px;
            border-radius: 14px;
            border: 2px solid #2a1a0e;
            box-shadow: 0 0 60px rgba(220,38,38,0.14),
                        inset 0 0 50px rgba(0,0,0,0.6);
            overflow: visible;
        }

        /* Individual cells */
        .hs-cell {
            width:  110px;
            height: 100px;
            background: linear-gradient(155deg, #1a1713, #261c14);
            border-radius: 8px;
            border: 1px solid #3a2818;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            position: relative;
            user-select: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .hs-cell.is-spinning {
            animation: cellFlicker 0.09s steps(1) infinite;
        }
        @keyframes cellFlicker {
            0%   { filter: brightness(0.45); }
            50%  { filter: brightness(1.15); }
            100% { filter: brightness(0.45); }
        }

        /* ── Coin in base game (unconfirmed scatter) ─────────────────── */
        .hs-cell.coin-scatter {
            background: linear-gradient(155deg, #3d1a00, #5a2800);
            border: 1px solid #d97706;
        }

        /* ── Coin in feature (locked, glowing) ──────────────────────── */
        .hs-cell.coin-locked {
            background: linear-gradient(155deg, #3d1a00, #6b2e00);
            border: 2px solid #fbbf24;
            animation: coinGlow 1.8s ease-in-out infinite alternate;
        }
        @keyframes coinGlow {
            from { box-shadow: 0 0 10px rgba(217,119,6,0.4); }
            to   { box-shadow: 0 0 24px rgba(251,191,36,0.85),
                               inset 0 0 14px rgba(251,191,36,0.12); }
        }

        .coin-val-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: #fbbf24;
            text-shadow: 0 0 6px rgba(251,191,36,0.9);
        }

        /* ── Jackpot coin cells ───────────────────────────────────────── */
        .hs-cell.jp-mini-cell {
            background: linear-gradient(155deg, #1c1917, #3b3229);
            border: 2px solid #fde68a;
        }
        .hs-cell.jp-minor-cell {
            background: linear-gradient(155deg, #1c0a00, #7c3000);
            border: 2px solid #fbbf24;
            box-shadow: 0 0 14px rgba(251,191,36,0.35);
        }
        .hs-cell.jp-major-cell {
            background: linear-gradient(155deg, #1c0a00, #9a3300);
            border: 2px solid #f97316;
            box-shadow: 0 0 20px rgba(249,115,22,0.45);
        }
        .hs-cell.jp-grand-cell {
            background: linear-gradient(155deg, #3b0000, #8b1a1a);
            border: 2px solid #fca5a5;
            animation: grandFlame 1s ease-in-out infinite alternate;
        }
        @keyframes grandFlame {
            from { box-shadow: 0 0 20px rgba(220,38,38,0.5); }
            to   { box-shadow: 0 0 44px rgba(251,191,36,1); }
        }
        .jp-name-label {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .jp-mini-cell  .jp-name-label { color: #fde68a; }
        .jp-minor-cell .jp-name-label { color: #fbbf24; }
        .jp-major-cell .jp-name-label { color: #fb923c; }
        .jp-grand-cell .jp-name-label { color: #fca5a5; }

        /* ── Empty / respin-eligible ──────────────────────────────────── */
        .hs-cell.respin-eligible {
            background: linear-gradient(155deg, #0f1520, #1a2035);
            border: 1px dashed #334155;
            opacity: 0.7;
        }

        /* Respin flash — brief orange pulse before coins drop */
        .hs-cell.respin-flash {
            animation: respinFlash 0.25s ease-in-out 3;
        }
        @keyframes respinFlash {
            0%,100% { border-color: #334155; }
            50%     { border-color: #f97316; box-shadow: 0 0 10px rgba(249,115,22,0.6); }
        }

        /* Win-line highlight */
        .hs-cell.win-glow {
            border-color: var(--success) !important;
            box-shadow: 0 0 18px rgba(34,197,94,0.7),
                        inset 0 0 10px rgba(34,197,94,0.15) !important;
            animation: winPop 0.5s ease 2;
        }
        @keyframes winPop {
            0%,100% { transform: scale(1); }
            50%     { transform: scale(1.07); }
        }

        /* Coin land bounce */
        .hs-cell.coin-bounce {
            animation: landBounce 0.28s ease-out;
        }
        @keyframes landBounce {
            0%   { transform: scale(1.25); }
            55%  { transform: scale(0.93); }
            100% { transform: scale(1); }
        }

        /* ── Absolute falling coin dropper ──────────────────────────── */
        .coin-dropper {
            position: absolute;
            pointer-events: none;
            z-index: 30;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 8px rgba(251,191,36,0.9));
            font-size: 2.4rem;
        }

        /* ── Win Splash ──────────────────────────────────────────────── */
        .hs-win-splash {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.88);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        .hs-win-splash.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .splash-fire-label {
            font-size: 0.9rem;
            color: #f97316;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .splash-win-amt {
            font-size: 3.2rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 40px rgba(251,191,36,0.85);
            line-height: 1.1;
        }
        .splash-collect-btn {
            margin-top: 20px;
            padding: 10px 32px;
            background: var(--success);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .splash-collect-btn:hover { filter: brightness(1.15); }

        /* ── Coin scatter trigger flash (3 coin found in base) ───────── */
        .hs-cell.trigger-flash {
            animation: triggerPulse 0.4s ease 3;
        }
        @keyframes triggerPulse {
            0%,100% { transform: scale(1); }
            50%     { transform: scale(1.15);
                      box-shadow: 0 0 30px rgba(251,191,36,1); }
        }

        /* ── Bonus Buy button ────────────────────────────────────────── */
        .btn-bonus-buy {
            width: 100%;
            background: linear-gradient(135deg, #92400e, #d97706);
            color: #fef3c7;
            border: 1px solid #fbbf24;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.4px;
            box-shadow: 0 0 14px rgba(217,119,6,0.25);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .btn-bonus-buy:hover:not(:disabled) {
            filter: brightness(1.12);
            transform: translateY(-1px);
            box-shadow: 0 0 24px rgba(251,191,36,0.45);
        }
        .btn-bonus-buy:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .bonus-buy-cost {
            font-size: 0.72rem;
            font-weight: 600;
            color: #fbbf24;
            opacity: 0.9;
        }

        /* ── Respin reset flash in status ────────────────────────────── */
        .hs-reset-flash {
            color: #fbbf24;
            font-size: 1.1rem;
            animation: resetPop 0.4s ease;
        }
        @keyframes resetPop {
            0%   { transform: scale(0.7); opacity: 0; }
            60%  { transform: scale(1.2); }
            100% { transform: scale(1);   opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar-container"></div>
    <div class="main-content">
        <div class="top-bar" id="topbar-container"></div>
        <div class="game-stage">
            <div class="game-view" id="view-holdspins" style="max-width:820px;">

                <div class="game-header" style="margin-bottom:18px;">
                    <h2>🔥 Hold &amp; Spin</h2>
                </div>

                <div class="hs-layout">

                    <!-- ── Left sidebar ──────────────────────────────── -->
                    <div class="hs-sidebar">

                        <!-- Jackpots -->
                        <div class="jackpot-strip">
                            <div class="jackpot-strip-title">Jackpots</div>
                            <div class="jackpot-row jp-grand-row">
                                <span>GRAND</span><span id="jp-grand-val">—</span>
                            </div>
                            <div class="jackpot-row jp-major-row">
                                <span>MAJOR</span><span id="jp-major-val">—</span>
                            </div>
                            <div class="jackpot-row jp-minor-row">
                                <span>MINOR</span><span id="jp-minor-val">—</span>
                            </div>
                            <div class="jackpot-row jp-mini-row">
                                <span>MINI</span><span id="jp-mini-val">—</span>
                            </div>
                        </div>

                        <!-- Bet & Spin -->
                        <div class="hs-controls">
                            <div class="control-group">
                                <label>Bet Amount</label>
                                <input type="number" id="hs-bet" class="input-dark"
                                       value="10" min="1" step="1">
                            </div>
                            <button class="btn-action" id="btn-hs-spin">Spin</button>
                            <button class="btn-bonus-buy" id="btn-hs-bonus-buy">
                                🎰 Bonus Buy
                                <span class="bonus-buy-cost" id="hs-bonus-cost">33× = $330.00</span>
                            </button>
                        </div>

                        <!-- Autospin -->
                        <div class="autospin-bar">
                            <select id="hs-autospin-count">
                                <option value="10">10 Spins</option>
                                <option value="25">25 Spins</option>
                                <option value="50" selected>50 Spins</option>
                                <option value="100">100 Spins</option>
                                <option value="500">500 Spins</option>
                                <option value="1000">1000 Spins</option>
                            </select>
                            <button class="btn-autospin" id="hs-btn-autospin">⚡ Autoplay</button>
                            <span class="autospin-counter" id="hs-autospin-counter"></span>
                        </div>

                        <!-- Paytable -->
                        <div class="hs-paytable">
                            <div class="hs-paytable-title">3-of-a-Kind Pays</div>
                            <div class="pay-row">
                                <span class="pay-sym">7️⃣</span>
                                <span class="pay-vals">20×</span>
                            </div>
                            <div class="pay-row">
                                <span class="pay-sym-bar">BAR</span>
                                <span class="pay-vals">10×</span>
                            </div>
                            <div class="pay-row">
                                <span class="pay-sym">🔔</span>
                                <span class="pay-vals">6×</span>
                            </div>
                            <div class="pay-row">
                                <span class="pay-sym">🍒</span>
                                <span class="pay-vals">4×</span>
                            </div>
                            <div class="pay-row">
                                <span class="pay-sym">🍋</span>
                                <span class="pay-vals">2.5×</span>
                            </div>
                            <div class="pay-row">
                                <span class="pay-sym">🍊</span>
                                <span class="pay-vals">1.5×</span>
                            </div>
                            <div class="pay-row" style="margin-top:8px;
                                 border-top:1px solid rgba(255,255,255,0.07);
                                 padding-top:7px; border-bottom:none;">
                                <span style="font-size:0.75rem;color:#f97316;font-weight:700;">
                                    🪙 3 coins = Coin Drop!
                                </span>
                            </div>
                        </div>

                    </div>

                    <!-- ── Main game area ─────────────────────────────── -->
                    <div class="hs-game-area">

                        <div class="hs-status" id="hs-status">
                            <span style="color:var(--text-muted)">Place your bet and spin!</span>
                        </div>

                        <!-- Grid + overlays -->
                        <div class="hs-grid-wrapper" id="hs-grid-wrapper">
                            <div class="hs-grid" id="hs-grid">
                                <!-- 9 cells injected by JS -->
                            </div>
                            <!-- Win splash overlay -->
                            <div class="hs-win-splash" id="hs-win-splash">
                                <div class="splash-fire-label" id="hs-splash-label">
                                    🔥 Coin Drop Complete!
                                </div>
                                <div class="splash-win-amt" id="hs-splash-amt">$0.00</div>
                                <button class="splash-collect-btn"
                                        onclick="HSGame.closeSplash()">
                                    Collect
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="platform.js"></script>
    <script>
        Platform.init('holdSpin');

        // ── Hold & Spin Game (3×3 + Coin Drop Bonus) ────────────────────────────
        const HSGame = {

            // ── Symbol config ────────────────────────────────────────────────────
            SYMBOLS: [
                { id: 'seven',  face: '7️⃣',  pay: 20   },
                { id: 'bar',    face: 'BAR', pay: 10   },
                { id: 'bell',   face: '🔔',  pay: 6    },
                { id: 'cherry', face: '🍒',  pay: 4    },
                { id: 'lemon',  face: '🍋',  pay: 2.5  },
                { id: 'orange', face: '🍊',  pay: 1.5  },
            ],
            // Relative weights (higher = more common)
            SYM_WEIGHTS: [2, 4, 6, 9, 12, 15],   // seven → orange
            COIN_WEIGHT: 3,                          // ~5.9% per cell → ~1.3% feature trigger rate

            // Coin value table for the bonus feature
            COIN_TABLE: [
                { v: 1,      w: 28   },
                { v: 2,      w: 22   },
                { v: 3,      w: 16   },
                { v: 5,      w: 11   },
                { v: 8,      w: 8    },
                { v: 10,     w: 5    },
                { v: 15,     w: 3    },
                { v: 20,     w: 2    },
                { v: 'MINI', w: 2    },
                { v: 'MINOR',w: 1    },
                { v: 'MAJOR',w: 0.4  },
                { v: 'GRAND',w: 0.05 },
            ],
            JP_MULTS: { MINI: 10, MINOR: 25, MAJOR: 100, GRAND: 500 },
            BONUS_BUY_MULT: 33,   // 33× bet → ~94% RTP on bonus buy

            // 5 paylines on the 3×3 grid (cells 0-8, row-major order)
            // Grid layout:  [0][1][2]
            //               [3][4][5]
            //               [6][7][8]
            PAYLINES: [
                [0, 1, 2],   // top row
                [3, 4, 5],   // middle row
                [6, 7, 8],   // bottom row
                [0, 4, 8],   // diagonal top-left → bottom-right
                [2, 4, 6],   // diagonal top-right → bottom-left
            ],

            // Columns (for reel-stop animation left→right)
            COLS: [
                [0, 3, 6],   // left reel
                [1, 4, 7],   // centre reel
                [2, 5, 8],   // right reel
            ],

            // ── State ────────────────────────────────────────────────────────────
            isSpinning:    false,
            betAmt:        10,
            actualWager:   0,        // cost paid (differs from betAmt during bonus buy)
            phase:         'base',   // 'base' | 'feature'
            grid:          [],       // 9 cells: { type, value, locked }
            respinCount:   0,
            totalCoinMult: 0,
            autoplay: { active: false, remaining: 0, paused: 0 },
            DOM: {},

            // ── Utility ──────────────────────────────────────────────────────────
            sleep: ms => new Promise(r => setTimeout(r, ms)),

            // ── Init ─────────────────────────────────────────────────────────────
            init() {
                this.DOM = {
                    grid:            document.getElementById('hs-grid'),
                    wrapper:         document.getElementById('hs-grid-wrapper'),
                    spinBtn:         document.getElementById('btn-hs-spin'),
                    bonusBuyBtn:     document.getElementById('btn-hs-bonus-buy'),
                    bonusBuyCost:    document.getElementById('hs-bonus-cost'),
                    betInput:        document.getElementById('hs-bet'),
                    status:          document.getElementById('hs-status'),
                    splash:          document.getElementById('hs-win-splash'),
                    splashLabel:     document.getElementById('hs-splash-label'),
                    splashAmt:       document.getElementById('hs-splash-amt'),
                    autospinBtn:     document.getElementById('hs-btn-autospin'),
                    autospinCount:   document.getElementById('hs-autospin-count'),
                    autospinCounter: document.getElementById('hs-autospin-counter'),
                };

                this.buildGrid();
                this.updateJackpotDisplay();

                this.DOM.spinBtn.onclick       = () => this.spin();
                this.DOM.bonusBuyBtn.onclick   = () => this.bonusBuy();
                this.DOM.autospinBtn.onclick   = () => this.toggleAutoplay();
                this.DOM.betInput.addEventListener('input', () => {
                    this.updateJackpotDisplay();
                    this.updateBonusBuyCost();
                });
            },

            // ── Grid management ──────────────────────────────────────────────────
            buildGrid() {
                this.DOM.grid.innerHTML = '';
                this.grid = [];
                for (let i = 0; i < 9; i++) {
                    const el = document.createElement('div');
                    el.id        = `hs-cell-${i}`;
                    el.className = 'hs-cell';
                    this.DOM.grid.appendChild(el);
                    this.grid.push({ type: 'empty', value: null, locked: false });
                }
            },

            renderCell(i, data) {
                const el = document.getElementById(`hs-cell-${i}`);
                el.className = 'hs-cell';
                el.innerHTML = '';

                if (data.type === 'symbol') {
                    const sym = this.SYMBOLS[data.value];
                    if (sym.id === 'bar') {
                        el.innerHTML = `<span style="font-size:1.2rem;font-weight:900;
                                         color:#fbbf24;letter-spacing:-1px;">BAR</span>`;
                    } else {
                        el.innerHTML = `<span style="font-size:2.4rem;">${sym.face}</span>`;
                    }

                } else if (data.type === 'coin') {
                    const v    = data.value;
                    const isJP = typeof v === 'string';

                    if (data.locked) {
                        // Feature coin — glowing
                        el.classList.add(isJP ? `jp-${v.toLowerCase()}-cell` : 'coin-locked');
                    } else {
                        // Base-game scatter coin
                        el.classList.add('coin-scatter');
                    }

                    if (isJP) {
                        el.innerHTML = `<span style="font-size:1.8rem;">🪙</span>
                                        <span class="jp-name-label">${v}</span>`;
                    } else {
                        el.innerHTML = `<span style="font-size:1.8rem;">🪙</span>
                                        <span class="coin-val-label">${v}×</span>`;
                    }

                } else if (data.type === 'respin') {
                    el.classList.add('respin-eligible');
                }
                // 'empty' → plain dark cell
            },

            renderAll() {
                for (let i = 0; i < 9; i++) this.renderCell(i, this.grid[i]);
            },

            setStatus(html) { this.DOM.status.innerHTML = html; },

            updateJackpotDisplay() {
                const bet = Math.max(1, parseFloat(this.DOM.betInput.value) || 10);
                document.getElementById('jp-grand-val').textContent = `$${(this.JP_MULTS.GRAND * bet).toFixed(2)}`;
                document.getElementById('jp-major-val').textContent = `$${(this.JP_MULTS.MAJOR * bet).toFixed(2)}`;
                document.getElementById('jp-minor-val').textContent = `$${(this.JP_MULTS.MINOR * bet).toFixed(2)}`;
                document.getElementById('jp-mini-val').textContent  = `$${(this.JP_MULTS.MINI  * bet).toFixed(2)}`;
                this.updateBonusBuyCost();
            },

            updateBonusBuyCost() {
                const bet  = Math.max(1, parseFloat(this.DOM.betInput.value) || 10);
                const cost = (bet * this.BONUS_BUY_MULT).toFixed(2);
                this.DOM.bonusBuyCost.textContent = `${this.BONUS_BUY_MULT}× = $${cost}`;
            },

            // ── RNG ──────────────────────────────────────────────────────────────
            pickCell() {
                const total = this.SYM_WEIGHTS.reduce((a, b) => a + b, 0) + this.COIN_WEIGHT;
                let r = Math.random() * total;
                for (let i = 0; i < this.SYM_WEIGHTS.length; i++) {
                    r -= this.SYM_WEIGHTS[i];
                    if (r <= 0) return { type: 'symbol', value: i, locked: false };
                }
                return { type: 'coin', value: this.pickCoinValue(), locked: false };
            },

            pickCoinValue() {
                const total = this.COIN_TABLE.reduce((a, b) => a + b.w, 0);
                let r = Math.random() * total;
                for (const entry of this.COIN_TABLE) {
                    r -= entry.w;
                    if (r <= 0) return entry.v;
                }
                return this.COIN_TABLE[0].v;
            },

            coinMult(v) {
                return typeof v === 'string' ? this.JP_MULTS[v] : v;
            },

            // ── Base Spin ────────────────────────────────────────────────────────
            async spin() {
                if (this.isSpinning) return;
                const bet = parseFloat(this.DOM.betInput.value);
                if (isNaN(bet) || bet <= 0 || bet > Platform.balance)
                    return Platform.showAlert('Invalid bet or insufficient balance!', 'Wager Error');

                this.isSpinning = true;
                this.betAmt     = bet;
                this.actualWager = bet;
                this.updateJackpotDisplay();
                Platform.adjustBalance(-bet);
                this.DOM.spinBtn.disabled      = true;
                this.DOM.bonusBuyBtn.disabled  = true;
                this.DOM.betInput.disabled     = true;
                this.setStatus('<span style="color:var(--text-muted)">Spinning…</span>');

                // Clear any lingering win-glow classes
                document.querySelectorAll('#hs-grid .hs-cell').forEach(el => {
                    el.classList.remove('win-glow', 'coin-bounce');
                });

                await this.doReelSpin();
                this.resolveBase();
            },

            // Reel-stop animation: columns stop left → right
            async doReelSpin() {
                const allFaces = [...this.SYMBOLS.map(s => s.face), '🪙'];

                // Start all cells spinning
                for (let i = 0; i < 9; i++) {
                    const el = document.getElementById(`hs-cell-${i}`);
                    el.className  = 'hs-cell is-spinning';
                    el.innerHTML  = '';
                    el._stopped   = false;
                }

                // Generate target grid now
                for (let i = 0; i < 9; i++) this.grid[i] = this.pickCell();

                // Cycle random symbols while spinning
                const tick = setInterval(() => {
                    for (let i = 0; i < 9; i++) {
                        const el = document.getElementById(`hs-cell-${i}`);
                        if (el._stopped) continue;
                        const f = allFaces[Math.floor(Math.random() * allFaces.length)];
                        el.innerHTML = (f === 'BAR')
                            ? `<span style="font-size:1.2rem;font-weight:900;color:#fbbf24;">BAR</span>`
                            : `<span style="font-size:2.4rem;">${f}</span>`;
                    }
                }, 80);

                // Stop each reel left → right with a 280ms gap
                for (const col of this.COLS) {
                    await this.sleep(280);
                    for (const idx of col) {
                        const el = document.getElementById(`hs-cell-${idx}`);
                        el._stopped  = true;
                        el.className = 'hs-cell';
                        this.renderCell(idx, this.grid[idx]);
                    }
                }

                clearInterval(tick);
            },

            resolveBase() {
                const coins = this.grid.filter(c => c.type === 'coin');

                if (coins.length >= 3) {
                    // Flash coin cells before transition to feature
                    coins.forEach((c, k) => {
                        const idx = this.grid.indexOf(c);
                        setTimeout(() => {
                            document.getElementById(`hs-cell-${idx}`)
                                    .classList.add('trigger-flash');
                        }, k * 80);
                    });
                    this.setStatus(
                        `<span class="hs-fire">🔥 ${coins.length} coins!</span>` +
                        `<span class="hs-gold">Coin Drop Triggered!</span>`
                    );
                    setTimeout(() => this.startFeature(), 1400);

                } else {
                    // Evaluate paylines
                    const mult     = this.evalPaylines();
                    const totalWin = +(mult * this.betAmt).toFixed(2);

                    if (totalWin > 0) {
                        Platform.adjustBalance(totalWin);
                        Platform.recordGame('holdSpin', this.betAmt, totalWin);
                        this.setStatus(`<span class="hs-green">🏆 Won $${totalWin.toFixed(2)}!</span>`);
                    } else {
                        Platform.recordGame('holdSpin', this.betAmt, 0);
                        this.setStatus(`<span style="color:var(--text-muted)">No win — try again</span>`);
                    }
                    this.finishBase(totalWin >= this.betAmt * 8);
                }
            },

            // ── Payline check: all 3 cells in each payline the same symbol ───────
            evalPaylines() {
                let totalMult = 0;
                const winSet  = new Set();

                for (const line of this.PAYLINES) {
                    const cells = line.map(i => this.grid[i]);
                    if (cells.some(c => c.type !== 'symbol')) continue;
                    if (cells[0].value !== cells[1].value || cells[1].value !== cells[2].value) continue;

                    totalMult += this.SYMBOLS[cells[0].value].pay;
                    line.forEach(i => winSet.add(i));
                }

                winSet.forEach(i => {
                    document.getElementById(`hs-cell-${i}`).classList.add('win-glow');
                });
                return totalMult;
            },

            // ── Bonus Buy ────────────────────────────────────────────────────────
            bonusBuy() {
                if (this.isSpinning || this.phase === 'feature') return;
                const bet = parseFloat(this.DOM.betInput.value);
                if (isNaN(bet) || bet <= 0)
                    return Platform.showAlert('Set a valid bet amount first.', 'Wager Error');

                const cost = +(bet * this.BONUS_BUY_MULT).toFixed(2);
                if (cost > Platform.balance)
                    return Platform.showAlert(`Insufficient balance. Bonus Buy costs $${cost.toFixed(2)}.`, 'Wager Error');

                Platform.showConfirm(
                    `Buy the Coin Drop bonus directly for $${cost.toFixed(2)} (${this.BONUS_BUY_MULT}× your $${bet.toFixed(2)} bet)?`,
                    () => this._executeBonusBuy(bet, cost)
                );
            },

            async _executeBonusBuy(bet, cost) {
                this.isSpinning    = true;
                this.betAmt        = bet;
                this.actualWager   = cost;
                this.DOM.spinBtn.disabled      = true;
                this.DOM.bonusBuyBtn.disabled  = true;
                this.DOM.betInput.disabled     = true;

                Platform.adjustBalance(-cost);
                this.updateJackpotDisplay();

                // Build a fresh grid — 3 coins in random positions, rest regular symbols
                const positions = Array.from({ length: 9 }, (_, i) => i);
                for (let i = positions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [positions[i], positions[j]] = [positions[j], positions[i]];
                }
                const coinSet = new Set(positions.slice(0, 3));

                for (let i = 0; i < 9; i++) {
                    if (coinSet.has(i)) {
                        this.grid[i] = { type: 'coin', value: this.pickCoinValue(), locked: false };
                    } else {
                        this.grid[i] = { type: 'symbol', value: Math.floor(Math.random() * this.SYMBOLS.length), locked: false };
                    }
                }

                // Clear any leftover glow classes then render
                document.querySelectorAll('#hs-grid .hs-cell').forEach(el => {
                    el.classList.remove('win-glow', 'coin-bounce', 'trigger-flash');
                });
                this.renderAll();

                // Flash the 3 starting coins
                [...coinSet].forEach((idx, k) => {
                    setTimeout(() => {
                        document.getElementById(`hs-cell-${idx}`).classList.add('trigger-flash');
                    }, k * 80);
                });

                this.setStatus(
                    `<span class="hs-fire">🎰 Bonus Buy!</span>` +
                    `<span class="hs-gold">Coin Drop Triggered!</span>`
                );
                await this.sleep(1400);
                this.startFeature();
            },

            // ── Coin Drop Feature ────────────────────────────────────────────────
            async startFeature() {
                this.phase         = 'feature';
                this.respinCount   = 3;
                this.totalCoinMult = 0;

                // Pause autoplay during feature (requires manual Collect)
                if (this.autoplay.active) {
                    this.autoplay.paused = this.autoplay.remaining;
                    this.stopAutoplay();
                }

                // Lock landed coins, mark everything else as respin-eligible
                for (let i = 0; i < 9; i++) {
                    if (this.grid[i].type === 'coin') {
                        this.grid[i].locked  = true;
                        this.totalCoinMult  += this.coinMult(this.grid[i].value);
                    } else {
                        this.grid[i] = { type: 'respin', value: null, locked: false };
                    }
                }
                this.renderAll();
                this.updateFeatureStatus();

                await this.sleep(700);
                await this.doRespin();
            },

            async doRespin() {
                if (this.respinCount <= 0) { this.endFeature(); return; }

                const emptyIdx = this.grid
                    .map((c, i) => i)
                    .filter(i => !this.grid[i].locked);

                if (emptyIdx.length === 0) { this.endFeature(); return; }

                // Brief flash to signal the respin is about to drop
                emptyIdx.forEach(i => {
                    document.getElementById(`hs-cell-${i}`).classList.add('respin-flash');
                });
                await this.sleep(500);
                emptyIdx.forEach(i => {
                    document.getElementById(`hs-cell-${i}`).classList.remove('respin-flash');
                });

                // Determine which empty cells land coins this respin
                this.respinCount--;
                const newCoinIdx = [];
                for (const i of emptyIdx) {
                    if (Math.random() < 0.12) {     // 12% coin chance per empty cell (tuned for ~95% RTP)
                        const v = this.pickCoinValue();
                        this.grid[i] = { type: 'coin', value: v, locked: true };
                        this.totalCoinMult += this.coinMult(v);
                        newCoinIdx.push(i);
                    } else {
                        this.grid[i] = { type: 'respin', value: null, locked: false };
                    }
                }

                // Any new coin resets the respin counter to 3
                if (newCoinIdx.length > 0) {
                    this.respinCount = 3;
                    // Brief visual flash so the player sees the reset
                    this.setStatus(
                        `<span class="hs-fire">🔥 COIN DROP</span>` +
                        `<span class="hs-reset-flash">🔄 +3 Spins!</span>` +
                        `<span class="hs-green">+$${(this.totalCoinMult * this.betAmt).toFixed(2)}</span>`
                    );
                    await this.sleep(600);
                }

                // ── Drop coins one by one with a short stagger ──────────────────
                // Use Promise.all with staggered starts so they overlap visually
                const dropTasks = newCoinIdx.map((cellIdx, k) =>
                    this.sleep(k * 160).then(() => this.dropCoin(cellIdx))
                );
                await Promise.all(dropTasks);

                // Re-render any non-coin cells (stays as respin-eligible)
                for (const i of emptyIdx) {
                    if (!this.grid[i].locked) this.renderCell(i, this.grid[i]);
                }

                this.updateFeatureStatus();
                await this.sleep(450);
                await this.doRespin();
            },

            // Animate a single coin dropping from above the grid into its cell
            dropCoin(cellIndex) {
                return new Promise(resolve => {
                    const wrapper  = this.DOM.wrapper;
                    const cellEl   = document.getElementById(`hs-cell-${cellIndex}`);

                    const wRect = wrapper.getBoundingClientRect();
                    const cRect = cellEl.getBoundingClientRect();

                    // Centre of the target cell, relative to wrapper top-left
                    const cx = cRect.left - wRect.left + cRect.width  / 2;
                    const cy = cRect.top  - wRect.top  + cRect.height / 2;

                    // Start 80px above the wrapper (will appear from above the grid)
                    const startY = -80;

                    const dropper = document.createElement('div');
                    dropper.className = 'coin-dropper';
                    dropper.style.left = `${cx}px`;
                    dropper.style.top  = `${startY}px`;
                    dropper.textContent = '🪙';
                    wrapper.appendChild(dropper);

                    // Fall with gravity (ease-in = accelerates downward)
                    const anim = dropper.animate(
                        [
                            { top: `${startY}px`, opacity: 0   },
                            { top: `${startY + 18}px`, opacity: 1, offset: 0.06 },
                            { top: `${cy}px`,     opacity: 1   },
                        ],
                        { duration: 480, easing: 'ease-in', fill: 'forwards' }
                    );

                    anim.onfinish = () => {
                        dropper.remove();
                        // Render the coin cell
                        this.renderCell(cellIndex, this.grid[cellIndex]);
                        // Landing bounce on the cell
                        cellEl.classList.add('coin-bounce');
                        setTimeout(() => {
                            cellEl.classList.remove('coin-bounce');
                            resolve();
                        }, 260);
                    };
                });
            },

            updateFeatureStatus() {
                const cur = (this.totalCoinMult * this.betAmt).toFixed(2);
                this.setStatus(
                    `<span class="hs-fire">🔥 COIN DROP</span>` +
                    `<span class="hs-gold">Respins: <strong>${this.respinCount}</strong></span>` +
                    `<span class="hs-green">+$${cur}</span>`
                );
            },

            endFeature() {
                const winAmt = +(this.totalCoinMult * this.betAmt).toFixed(2);
                Platform.adjustBalance(winAmt);
                // Record wager as the actual amount paid (bonus buy costs more than betAmt)
                const wager = this.actualWager > 0 ? this.actualWager : this.betAmt;
                this.actualWager = 0;
                Platform.recordGame('holdSpin', wager, winAmt);

                let label = '🔥 Coin Drop Complete!';
                if (this.totalCoinMult >= this.JP_MULTS.GRAND)      label = '🎉 GRAND JACKPOT! 🎉';
                else if (this.totalCoinMult >= this.JP_MULTS.MAJOR)  label = '🎉 MAJOR JACKPOT!';
                else if (this.totalCoinMult >= this.JP_MULTS.MINOR)  label = '🏆 Big Win!';

                this.DOM.splashLabel.innerHTML = label;
                this.DOM.splashAmt.textContent = `$${winAmt.toFixed(2)}`;
                this.DOM.splash.classList.add('visible');
            },

            closeSplash() {
                this.DOM.splash.classList.remove('visible');
                this.phase                     = 'base';
                this.isSpinning                = false;
                this.DOM.spinBtn.disabled      = false;
                this.DOM.bonusBuyBtn.disabled  = false;
                this.DOM.betInput.disabled     = false;
                this.setStatus(`<span style="color:var(--text-muted)">Ready to spin!</span>`);

                // Resume autoplay if it was paused for the feature
                if (this.autoplay.paused > 0) {
                    const rem = this.autoplay.paused;
                    this.autoplay.paused    = 0;
                    this.autoplay.active    = true;
                    this.autoplay.remaining = rem;
                    this.DOM.autospinBtn.classList.add('active');
                    this.DOM.autospinBtn.innerText     = '■ Stop';
                    this.DOM.autospinCounter.innerText = `${rem} left`;
                    setTimeout(() => this.nextAutoSpin(), 500);
                }
            },

            // Called after base-game outcomes (no splash needed)
            finishBase(isBigWin) {
                this.isSpinning                = false;
                this.DOM.spinBtn.disabled      = false;
                this.DOM.bonusBuyBtn.disabled  = false;
                this.DOM.betInput.disabled     = false;

                if (this.autoplay.active) {
                    setTimeout(() => this.nextAutoSpin(), isBigWin ? 1800 : 700);
                }
            },

            // ── Autoplay ─────────────────────────────────────────────────────────
            toggleAutoplay() {
                if (this.autoplay.active) {
                    this.stopAutoplay();
                } else {
                    if (this.isSpinning || this.phase === 'feature') return;
                    const count = parseInt(this.DOM.autospinCount.value);
                    this.autoplay.active    = true;
                    this.autoplay.remaining = count;
                    this.DOM.autospinBtn.classList.add('active');
                    this.DOM.autospinBtn.innerText = '■ Stop';
                    this.nextAutoSpin();
                }
            },

            stopAutoplay() {
                this.autoplay.active    = false;
                this.autoplay.remaining = 0;
                this.DOM.autospinBtn.classList.remove('active');
                this.DOM.autospinBtn.innerText     = '⚡ Autoplay';
                this.DOM.autospinCounter.innerText = '';
            },

            nextAutoSpin() {
                if (!this.autoplay.active || this.autoplay.remaining <= 0) {
                    this.stopAutoplay(); return;
                }
                if (Platform.balance < (parseFloat(this.DOM.betInput.value) || 10)) {
                    this.stopAutoplay();
                    this.setStatus('<span style="color:var(--danger)">Autoplay stopped — insufficient balance.</span>');
                    return;
                }
                this.DOM.autospinCounter.innerText = `${this.autoplay.remaining} left`;
                this.autoplay.remaining--;
                this.spin();
            },
        };

        document.addEventListener('platform:ready', () => HSGame.init());
    </script>
</body>
</html>
