    <title>Slice &amp; Spin — Pizza Hero Gaming</title>
    <!-- Tact's Casino balance bridge — must run before game module -->
    <script>
    (function () {
      var BALANCE_KEY = 'phg_holdspin_balance';
      var _orig = Storage.prototype.setItem;

      Storage.prototype.setItem = function (k, v) {
        _orig.call(this, k, v);
        if (k === BALANCE_KEY) {
          try { window.parent.postMessage({ type: 'PHG_BALANCE', balance: JSON.parse(v) }, '*'); } catch (_) {}
        }
      };

      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'PHG_SET_BALANCE') return;
        _orig.call(localStorage, BALANCE_KEY, JSON.stringify(e.data.balance));
      });
    })();
    </script>
