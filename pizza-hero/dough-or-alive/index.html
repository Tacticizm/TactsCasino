    <title>Dough or Alive — Pizza Hero Gambling</title>
    <!-- Tact's Casino balance bridge — must run before game module -->
    <script>
    (function () {
      var BALANCE_KEY  = 'phg_doa_balance';
      var MIN_BET      = 10;
      var _lastBalance = null;
      var _orig        = Storage.prototype.setItem;

      // Intercept every localStorage write on the balance key
      Storage.prototype.setItem = function (k, v) {
        if (k === BALANCE_KEY) {
          var num = JSON.parse(v);
          if (typeof num === 'number') {
            // Block top-up: previous balance < min bet and game jumps to startingBalance
            var prevLow = _lastBalance !== null && _lastBalance < MIN_BET;
            var isTopUp = prevLow && num > _lastBalance * 5;
            _lastBalance = num;
            if (isTopUp) return; // swallow — casino controls the balance
            _orig.call(this, k, v);
            try { window.parent.postMessage({ type: 'PHG_BALANCE', balance: num }, '*'); } catch (_) {}
            return;
          }
        }
        _orig.call(this, k, v);
      };

      // Receive seeded balance from parent before game reads localStorage
      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'PHG_SET_BALANCE') return;
        _lastBalance = e.data.balance;
        _orig.call(localStorage, BALANCE_KEY, JSON.stringify(e.data.balance));
      });
    })();
    </script>
