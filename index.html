<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lobby - Tact's Casino</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lobby-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        .lobby-header {
            margin-bottom: 0;
        }

        .lobby-header h1 {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #ffe566 0%, #ffd700 55%, #c9960c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 4px;
            filter: drop-shadow(0 0 24px rgba(255,215,0,0.2));
        }

        .lobby-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ── Provider Section ──────────────────────────────────────── */
        .provider-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .provider-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid;
            position: relative;
            overflow: hidden;
        }

        .provider-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.06;
            background: var(--banner-shine);
            pointer-events: none;
        }

        .provider-tact {
            background: linear-gradient(120deg, rgba(120,80,0,0.35), rgba(20,14,0,0.6));
            border-color: rgba(255,215,0,0.18);
            --banner-shine: linear-gradient(120deg, #ffd700, transparent 60%);
        }

        .provider-pizza {
            background: linear-gradient(120deg, rgba(180,30,0,0.3), rgba(20,5,0,0.6));
            border-color: rgba(255,100,50,0.18);
            --banner-shine: linear-gradient(120deg, #ff6030, transparent 60%);
        }

        .provider-icon {
            font-size: 2rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .provider-text {
            flex: 1;
            min-width: 0;
        }

        .provider-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .provider-tact  .provider-name { color: var(--gold); }
        .provider-pizza .provider-name { color: #ff7a45; }

        .provider-tagline {
            font-size: 0.73rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .provider-count {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .provider-tact  .provider-count { background: rgba(255,215,0,0.1);  color: var(--gold);   border: 1px solid rgba(255,215,0,0.2);  }
        .provider-pizza .provider-count { background: rgba(255,100,50,0.1); color: #ff7a45; border: 1px solid rgba(255,100,50,0.2); }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 16px;
        }

        .provider-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 32px 20px;
            border-radius: 14px;
            border: 1px dashed rgba(255,100,50,0.2);
            background: rgba(255,100,50,0.03);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar-container"></div>

    <div class="main-content">
        <div class="top-bar" id="topbar-container"></div>

        <div class="game-stage">
            <div class="lobby-container">

                <div class="lobby-header">
                    <h1>Tact's Casino</h1>
                    <p>Choose a game &amp; place your bets</p>
                </div>

                <div id="lobby-providers"></div>

            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="platform.js"></script>
    <script>
        // ── Provider & Game Config ───────────────────────────────────────────────
        //
        // To add a game:  push a new entry to the provider's `games` array.
        // badge options:  'new' | 'hot' | null   (null = no badge)
        // Each provider's badges are completely independent of every other provider.
        //
        const PROVIDERS = [
            {
                id:      'tacts',
                theme:   'tact',
                icon:    '⭐',
                name:    "Tact's Originals",
                tagline: 'Exclusive in-house games built for Tact\'s Casino',
                games: [
                    {
                        href:  'slots.html',
                        emoji: '🎰',
                        title: 'Foodie Slots',
                        desc:  'Match symbols for big wins',
                        col1:  '#d97706', col2: '#7c2d12',
                        badge: null,
                    },
                    {
                        href:  'sugar-rush.html',
                        emoji: '🍬',
                        title: 'Sugar Rush',
                        desc:  'Sweet cluster pays',
                        col1:  '#be185d', col2: '#701a75',
                        badge: 'hot',
                    },
                    {
                        href:  'crash.html',
                        emoji: '📈',
                        title: 'Crash',
                        desc:  'Cash out before it crashes',
                        col1:  '#dc2626', col2: '#7f1d1d',
                        badge: null,
                    },
                    {
                        href:  'coinflip.html',
                        emoji: '🪙',
                        title: 'Coin Flip',
                        desc:  'Double or nothing',
                        col1:  '#b45309', col2: '#1c1917',
                        badge: null,
                    },
                    {
                        href:  'mines.html',
                        emoji: '💣',
                        title: 'Mines',
                        desc:  'Navigate the minefield',
                        col1:  '#c2410c', col2: '#1c0a00',
                        badge: null,
                    },
                    {
                        href:  'hilo.html',
                        emoji: '📉',
                        title: 'HiLo',
                        desc:  'Higher or lower?',
                        col1:  '#6d28d9', col2: '#1e0a3c',
                        badge: null,
                    },
                    {
                        href:  'plinko.html',
                        emoji: '🔽',
                        title: 'Plinko',
                        desc:  'Drop the ball, win big',
                        col1:  '#0e7490', col2: '#082f49',
                        badge: null,
                    },
                    {
                        href:  'hold-spin.html',
                        emoji: '🔥',
                        title: 'Hold &amp; Spin',
                        desc:  '3 coins ignites Hold &amp; Spin',
                        col1:  '#dc2626', col2: '#7c1d1d',
                        badge: 'new',
                    },
                ],
            },
            {
                id:      'pizza-hero',
                theme:   'pizza',
                icon:    '🍕',
                name:    'Pizza Hero Gambling',
                tagline: 'Games by Pizza Hero Gaming',
                games:   [
                    {
                        href:  'slice-and-spin.html',
                        emoji: '🍕',
                        title: 'Slice &amp; Spin',
                        desc:  'Fill the Hot Box for big wins',
                        col1:  '#b91c1c', col2: '#431407',
                        badge: 'new',
                    },
                ],
            },
        ];

        // ── Renderer ─────────────────────────────────────────────────────────────
        const BADGE_CONFIG = {
            hot: { cls: 'card-badge-hot', label: '🔥 Hot'  },
            new: { cls: 'card-badge-new', label: '✨ New'  },
        };

        function buildLobby() {
            const root = document.getElementById('lobby-providers');
            root.style.display = 'flex';
            root.style.flexDirection = 'column';
            root.style.gap = '36px';

            for (const provider of PROVIDERS) {
                const gameCount  = provider.games.length;
                const countLabel = gameCount > 0 ? `${gameCount} GAME${gameCount !== 1 ? 'S' : ''}` : 'COMING SOON';

                const section = document.createElement('div');
                section.className = 'provider-section';
                section.innerHTML = `
                    <div class="provider-banner provider-${provider.theme}">
                        <div class="provider-icon">${provider.icon}</div>
                        <div class="provider-text">
                            <div class="provider-name">${provider.name}</div>
                            <div class="provider-tagline">${provider.tagline}</div>
                        </div>
                        <div class="provider-count">${countLabel}</div>
                    </div>
                `;

                if (gameCount === 0) {
                    section.innerHTML += `
                        <div class="provider-empty">
                            ${provider.icon}&nbsp;&nbsp;${provider.name} games are on the way — check back soon!
                        </div>
                    `;
                } else {
                    const grid = document.createElement('div');
                    grid.className = 'game-grid';

                    for (const game of provider.games) {
                        const badge = game.badge && BADGE_CONFIG[game.badge]
                            ? `<span class="card-badge ${BADGE_CONFIG[game.badge].cls}">${BADGE_CONFIG[game.badge].label}</span>`
                            : '';

                        grid.innerHTML += `
                            <a href="${game.href}" class="game-card"
                               style="--card-col1:${game.col1}; --card-col2:${game.col2};">
                                ${badge}
                                <div class="card-thumb">
                                    <span class="card-emoji">${game.emoji}</span>
                                </div>
                                <div class="card-info">
                                    <div class="card-title">${game.title}</div>
                                    <div class="card-bottom">
                                        <span class="card-desc">${game.desc}</span>
                                        <span class="card-play">Play ›</span>
                                    </div>
                                </div>
                            </a>
                        `;
                    }
                    section.appendChild(grid);
                }

                root.appendChild(section);
            }
        }

        Platform.init('home');
        document.addEventListener('platform:ready', buildLobby);
    </script>
</body>
</html>
